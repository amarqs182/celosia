name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: linux-${{ matrix.compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc
            export CXX=g++
          else
            export CC=clang
            export CXX=clang++
          fi
          # ps2xTest links ps2_analyzer_lib unconditionally, so the analyzer must
          # stay enabled (PS2X_BUILD_ANALYZER=ON) or CMake configure fails.
          cmake -S PS2Recomp -B build -G Ninja -DPS2X_BUILD_TEST=ON -DPS2X_BUILD_STUDIO=OFF -DPS2X_BUILD_ANALYZER=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Tests
        run: ./build/ps2xTest/ps2x_tests

      - name: CTest gs_cache
        run: ctest --test-dir build -R gs_cache --output-on-failure

  windows:
    name: windows-msvc-x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure
        run: cmake -S PS2Recomp -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Tests
        run: build/ps2xTest/Release/ps2x_tests.exe
