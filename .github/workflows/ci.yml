name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: linux-${{ matrix.compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libsdl2-dev

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc
            export CXX=g++
          else
            export CC=clang
            export CXX=clang++
          fi
          # ps2xTest links ps2_analyzer_lib unconditionally, so the analyzer must
          # stay enabled (PS2X_BUILD_ANALYZER=ON) or CMake configure fails.
          cmake -S PS2Recomp -B build -G Ninja -DPS2X_BUILD_TEST=ON -DPS2X_BUILD_STUDIO=OFF -DPS2X_BUILD_ANALYZER=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-msse4.1 -DCMAKE_CXX_FLAGS=-msse4.1

      - name: Build
        run: cmake --build build --config Release

      - name: Tests
        run: ./build/ps2xTest/ps2x_tests

      - name: CTest gs_cache
        run: ctest --test-dir build -R gs_cache --output-on-failure

  # The runtime is not yet portable to MSVC (__attribute__((...)),
  # __atomic_store_n/__ATOMIC_RELAXED and __builtin_expect without a compatibility layer); the MSVC port goes in a separate PR.
  linux-aarch64:
    name: linux-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install AArch64 toolchain and dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libgl-dev:arm64 libx11-dev:arm64 libxrandr-dev:arm64 \
            libxinerama-dev:arm64 libxcursor-dev:arm64 libxi-dev:arm64 \
            libavcodec-dev:arm64 libavformat-dev:arm64 libavutil-dev:arm64 \
            libswresample-dev:arm64 libswscale-dev:arm64 zlib1g-dev:arm64 libsdl2-dev:arm64
 
      - name: Configure (AArch64)
        run: |
          PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
          cmake -S PS2Recomp -B build-aarch64 -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DPS2X_BUILD_TEST=OFF \
            -DPS2X_BUILD_STUDIO=OFF \
            -DPS2X_BUILD_ANALYZER=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (AArch64)
        run: cmake --build build-aarch64 --config Release
        
